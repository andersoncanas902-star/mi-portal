  <main class="container my-5">
  <h1 class="text-center mb-4">Contáctanos</h1>

  <!-- Aquí van los mensajes de error/éxito que genera JS, SIN alert() -->
  <div id="mensajeForm" class="alert d-none" role="alert"></div>

  <form id="formContacto" novalidate class="col-md-6 mx-auto">
    <div class="mb-3">
      <label for="nombre" class="form-label">Nombre completo</label>
      <input type="text" class="form-control" id="nombre" name="nombre">
      <div class="form-text text-danger" id="errorNombre"></div>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Correo electrónico</label>
      <input type="email" class="form-control" id="email" name="email">
      <div class="form-text text-danger" id="errorEmail"></div>
    </div>

    <div class="mb-3">
      <label for="mensaje" class="form-label">Mensaje</label>
      <textarea class="form-control" id="mensaje" name="mensaje" rows="4"></textarea>
      <div class="form-text text-danger" id="errorMensaje"></div>
    </div>

    <div class="mb-3">
      <label for="servicio" class="form-label">Servicio de interés</label>
      <select class="form-select" id="servicio" name="servicio">
        <option value="">Selecciona una opción</option>
        <option value="facturacion">Sistema de facturación</option>
        <option value="web">Desarrollo web</option>
        <option value="soporte">Soporte técnico</option>
      </select>
      <div class="form-text text-danger" id="errorServicio"></div>
    </div>

    <div class="mb-3 form-check">
      <input type="checkbox" class="form-check-input" id="terminos">
      <label class="form-check-label" for="terminos">Acepto el tratamiento de mis datos</label>
      <div class="form-text text-danger" id="errorTerminos"></div>
    </div>

    <button type="submit" class="btn btn-primary w-100">Enviar</button>
  </form>
</main>
