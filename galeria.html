  <main class="container my-5">
  <h1 class="text-center mb-4">Galería</h1>

  <!-- VIDEO incrustado -->
  <section class="mb-5 text-center">
    <h2>Conócenos en video</h2>
    <div class="ratio ratio-16x9">
      <iframe src="https://www.youtube.com/embed/OrLM7awX5Ls"
        title="Video AndoSoft" allowfullscreen></iframe>
    </div>
  </section>

  <!-- GRID de imágenes con figure/figcaption -->
  <section>
    <h2>Nuestro trabajo</h2>
    <div class="row g-3">
      <div class="col-md-4">
        <figure>
          <img src="img/software.jpg" class="img-fluid rounded" alt="Pantalla de un sistema de software de gestión">
          <figcaption>Software a la medida</figcaption>
        </figure>
      </div>
      <div class="col-md-4">
        <figure>
          <img src="img/programming.jpg" class="img-fluid rounded" alt="Código fuente en un editor de programación">
          <figcaption>Desarrollo y programación</figcaption>
        </figure>
      </div>
      <div class="col-md-4">
        <figure>
          <img src="img/office.jpg" class="img-fluid rounded" alt="Oficina de trabajo del equipo AndoSoft">
          <figcaption>Nuestro espacio de trabajo</figcaption>
        </figure>
      </div>
      <div class="col-md-4">
        <figure>
          <img src="img/technology.jpg" class="img-fluid rounded" alt="Equipos y tecnología usados en los proyectos">
          <figcaption>Tecnología aplicada</figcaption>
        </figure>
      </div>
      <div class="col-md-4">
        <figure>
          <img src="img/startup.jpg" class="img-fluid rounded" alt="Ambiente de emprendimiento y crecimiento">
          <figcaption>Espíritu emprendedor</figcaption>
        </figure>
      </div>
      <div class="col-md-4">
        <figure>
          <img src="img/teamwork.jpg" class="img-fluid rounded" alt="Equipo de AndoSoft trabajando en conjunto">
          <figcaption>Trabajo en equipo</figcaption>
        </figure>
      </div>
    </div>
  </section>

  <!-- 3 cards más, completando las 6 que pide la guía junto con las de index.html -->
  <section class="row g-4 mt-4">
    <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">Proyecto 1</h5></div></div></div>

    <div class="col-md-4"><div class="card"><div class="card-body"><h5 class="card-title">Proyecto 3</h5></div></div></div>
